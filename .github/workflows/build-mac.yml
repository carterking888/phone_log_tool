name: Build macOS App
# 没有 mac 机器时的打包路径：PyInstaller 不能交叉编译，
# 借 GitHub Actions 的 mac runner 产出真正的 .app。
# 用法：Actions 页 -> Build macOS App -> Run workflow（可只选一种架构）
#
# 说明：**日常出包不用手动点**。master 合并进 main 后由 release.yml 自动打包并发
# Release（mac 双架构 + Windows 都在 Release 的 assets 里）。本工作流只用于
#「只想单独打一个 mac 包、不想发 Release」的场景。
#
# 注意：matrix 上下文只能在 step 级 if 里引用（job 级 if 在 matrix
# 展开前求值，引用 matrix 会报 Unrecognized named-value），所以
# "单选架构"的跳过逻辑放在每个 step 的 if 上，而不是 job 的 if。
# 每个 step 的条件同时兼容 push（无 inputs，全部执行）和手动（按 arch 过滤）两种触发。
on:
  push:
    branches: [main]
    # 只改文档不打包，省 runner 时长
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      arch:
        description: '构建架构'
        required: true
        default: 'both'
        type: choice
        options: [both, arm64, x86_64]
      dmg:
        description: '额外产出 dmg'
        required: false
        default: true
        type: boolean
      with_ios:
        description: '包含 iOS 支持（pymobiledevice3，体积约 +30MB）'
        required: false
        default: true
        type: boolean

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14+ 是 Apple Silicon(arm64)；macos-13 是最后一档 Intel(x86_64)
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64
    runs-on: ${{ matrix.os }}

    env:
      # 构建源固定 main：手动跑也拿主干代码，不会因为选错分支打出旧包
      BUILD_REF: main

    steps:
      - name: Checkout main
        if: ${{ github.event_name == 'push' || github.event.inputs.arch == 'both' || github.event.inputs.arch == matrix.arch }}
        uses: actions/checkout@v4
        with:
          # push 到 main：就打这次合并进来的那个提交，避免排队期间 main 又被推进导致"打的不是刚合的"
          # 手动触发：取 main 最新
          ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_REF }}
          fetch-depth: 0

      - name: Show build source
        if: ${{ github.event_name == 'push' || github.event.inputs.arch == 'both' || github.event.inputs.arch == matrix.arch }}
        run: |
          echo "event    : ${{ github.event_name }}"
          echo "build ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_REF }} -> $(git rev-parse --short HEAD)"
          echo "subject  : $(git log -1 --format=%s)"

      - name: Set up Python
        if: ${{ github.event_name == 'push' || github.event.inputs.arch == 'both' || github.event.inputs.arch == matrix.arch }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Show toolchain
        if: ${{ github.event_name == 'push' || github.event.inputs.arch == 'both' || github.event.inputs.arch == matrix.arch }}
        run: |
          sw_vers
          uname -m
          xcode-select -p

      - name: Build .app
        if: ${{ github.event_name == 'push' || github.event.inputs.arch == 'both' || github.event.inputs.arch == matrix.arch }}
        run: |
          chmod +x build_mac.sh
          # push 触发时 inputs 为空 -> 默认带 iOS（目标机无需任何 Python 环境）
          if [ "${{ github.event.inputs.with_ios }}" != "false" ]; then
            export WITH_IOS=1
            echo "iOS 支持：启用（pymobiledevice3 将打进包，目标机无需任何 Python 环境）"
          else
            echo "iOS 支持：关闭（包体积更小，仅 Android）"
          fi
          if [ "${{ github.event.inputs.dmg }}" != "false" ]; then
            ./build_mac.sh --dmg
          else
            ./build_mac.sh
          fi

      - name: Smoke test (app 能启动 + 内置 server 可达)
        if: ${{ github.event_name == 'push' || github.event.inputs.arch == 'both' || github.event.inputs.arch == matrix.arch }}
        run: |
          # .app 里的可执行文件在 Contents/MacOS（名字与 bundle 同名）
          NAME="device_bebugging_tool"
          EXE="dist/$NAME.app/Contents/MacOS/$NAME"
          test -x "$EXE" || { echo "[错误] 找不到可执行文件"; exit 1; }
          # 后台拉起 app（无 GUI 会话，只看进程能否活过 CLR/objc 初始化）
          "$EXE" &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            echo "进程存活 15s -> OK"
            kill "$PID" || true
          else
            echo "[错误] 进程 15s 内退出（依赖缺失或签名问题）"
            exit 1
          fi
          # pyobjc / web 资源是否进包。
          # 注意：PyInstaller 6 的 BUNDLE 会按类型重排目录——二进制(.so)进
          # Contents/Frameworks、数据文件进 Contents/Resources，没有 _internal，
          # 所以这里用 find 全 bundle 搜，不写死具体子目录。
          SO_N=$(find dist/$NAME.app/Contents -path "*/core/*.so" | wc -l)
          echo "core .so 数量: $SO_N"
          [ "$SO_N" -ge 10 ] || { echo "[错误] core .so 少于 10 个"; exit 1; }
          find dist/$NAME.app/Contents -path "*/web/index.html" -print -quit | grep -q . \
              || { echo "[错误] web/index.html 未进包"; exit 1; }
          # 内置 adb：目标机没有 Android SDK / brew 也能连 Android 设备
          ADB_BIN="dist/$NAME.app/Contents/MacOS/public_settings/adb/adb"
          test -x "$ADB_BIN" || { echo "[错误] 内置 adb 缺失"; exit 1; }
          "$ADB_BIN" version | head -2

      - name: Upload artifacts
        if: ${{ github.event_name == 'push' || github.event.inputs.arch == 'both' || github.event.inputs.arch == matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: device_bebugging_tool-macos-${{ matrix.arch }}
          path: dist/device_bebugging_tool_*_macos_*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload dmg
        # push 触发时 inputs 为空 -> 默认出 dmg；手动触发时按勾选决定
        if: ${{ (github.event_name == 'push' || github.event.inputs.arch == 'both' || github.event.inputs.arch == matrix.arch) && github.event.inputs.dmg != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: device_bebugging_tool-macos-${{ matrix.arch }}-dmg
          path: dist/device_bebugging_tool_*_macos_*.dmg
          if-no-files-found: error
          retention-days: 14
