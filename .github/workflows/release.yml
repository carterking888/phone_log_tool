name: Release

# 两种发版方式，产物都会自动挂到 GitHub Release（assets）：
#
#   A) 自动：push 到 main 后立刻出包并发「预发布」Release（仓库现在只有 main 一个分支）
#      - tag    : v<APP_VERSION>-b<run 号>   例：v2.7.0-b42
#      - 产物   : device_bebugging_tool_v2.7.0-b42_macos_arm64.zip
#                 device_bebugging_tool_v2.7.0-b42_macos_x86_64.zip
#                 device_bebugging_tool_v2.7.0-b42_win64.zip
#      - 每次合并都会生成一个新 tag / Release，标记 pre-release，不影响正式版
#
#   B) 正式：手动打 tag（流程不变）
#      1. 把 core/api.py 的 APP_VERSION 改成发布版本（如 "2.7.1"），提交并合进 main
#      2. git tag v2.7.1 && git push origin v2.7.1
#      - CI 会校验 tag 与 APP_VERSION 一致，不一致直接失败（防止版本错位）
#      - 产物：device_bebugging_tool_v2.7.1_{win64,macos_arm64,macos_x86_64}.zip
#
# 构建源：push 触发打的就是本次合并的那个提交；tag 触发固定取 main（env.BUILD_REF）。

on:
  push:
    branches: [main]
    tags: ['v*']
    # 只改文档不发版，省 runner 时长
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: write

env:
  BUILD_REF: main   # tag 触发时的构建源分支（push 触发用 github.sha）
  # CI 的 Windows runner stdout 默认 cp1252：adb_tool.spec / pyd_pack.py 里的
  # 中文 print 会 UnicodeEncodeError，强制 utf-8（对 mac/linux 无影响）
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14+ 是 Apple Silicon(arm64)；Intel(x86_64) 必须用 macos-15-intel
          # ★ macos-13 已被 GitHub 于 2025-12-04 下线：label 没有匹配的 runner 时
          #   不会报错，而是**排队到 24h 上限再自动取消**（表现为永远"等待中"，
          #   publish 被一直卡住、tag/Release 都出不来）。
          #   macos-15-intel 是官方现存的 x86_64 镜像，支持到约 2027-08。
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90   # 兜底：万一 label 失效也不会挂满 24h
    steps:
      - uses: actions/checkout@v4
        with:
          # push -> 打刚合进来的提交；tag -> 取 main
          ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_REF }}
          fetch-depth: 0

      - name: Show build source
        run: |
          echo "event    : ${{ github.event_name }}"
          echo "ref      : ${{ github.ref_name }}"
          echo "commit   : $(git rev-parse --short HEAD)"
          echo "subject  : $(git log -1 --format=%s)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Version check（仅正式发版：tag 必须等于 APP_VERSION）
        run: |
          APP_VER=$(grep -oE 'APP_VERSION *= *"[^"]+"' core/api.py | head -1 | cut -d'"' -f2)
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "自动构建：APP_VERSION=$APP_VER，tag 将为 v${APP_VER}-b${{ github.run_number }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag=v$TAG  APP_VERSION=$APP_VER"
            [ "$TAG" = "$APP_VER" ] \
              || { echo "[错误] tag v$TAG 与 APP_VERSION $APP_VER 不一致：改 APP_VERSION 后重新打 tag"; exit 1; }
          fi

      - name: Build .app（WITH_IOS=1，内置 adb，zip 名自带版本号）
        run: |
          chmod +x build_mac.sh
          WITH_IOS=1 ./build_mac.sh

      - name: Smoke test（可执行文件存在且进程能活过初始化）
        run: |
          NAME="device_bebugging_tool"
          APP_VER=$(grep -oE 'APP_VERSION *= *"[^"]+"' core/api.py | head -1 | cut -d'"' -f2)
          EXE="dist/$NAME.app/Contents/MacOS/$NAME"
          test -x "$EXE" || { echo "[错误] 找不到 $EXE"; exit 1; }
          test -f "dist/${NAME}_v${APP_VER}_macos_${{ matrix.arch }}.zip" \
            || { echo "[错误] 分发 zip 未生成"; exit 1; }
          "$EXE" & PID=$!
          sleep 15
          kill -0 "$PID" 2>/dev/null && { echo "进程存活 15s -> OK"; kill "$PID" || true; } \
            || { echo "[错误] 进程 15s 内退出"; exit 1; }

      # 自动构建（push）时给文件名加 -b<run 号>，避免不同 Release 里同名分不清
      - name: Rename with build number
        if: ${{ github.event_name == 'push' }}
        run: |
          cd dist
          for f in device_bebugging_tool_v*_macos_*.zip; do
            [ -f "$f" ] || continue
            mv "$f" "${f%.zip}-b${{ github.run_number }}.zip"
            echo "renamed -> ${f%.zip}-b${{ github.run_number }}.zip"
          done
          ls -1

      # 注意：上面的 Rename 会改文件名（末尾加 -b<run 号>），所以这里的 path
      # 必须用能匹配"改名后"的通配式（曾写死 *_win64.zip → 改名后匹配不到 → 报
      # "No files were found"，整个 Windows job 失败、Release 也建不出来）
      - name: List dist
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos-${{ matrix.arch }}
          path: dist/device_bebugging_tool_*.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WITH_IOS: '1'   # adb_tool.spec 读取：打进 pymobiledevice3（iOS 支持）
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_REF }}
          fetch-depth: 0

      - name: Show build source
        shell: bash
        run: |
          echo "event    : ${{ github.event_name }}"
          echo "ref      : ${{ github.ref_name }}"
          echo "commit   : $(git rev-parse --short HEAD)"
          echo "subject  : $(git log -1 --format=%s)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Version check（仅正式发版：tag 必须等于 APP_VERSION）
        shell: bash
        run: |
          APP_VER=$(grep -oE 'APP_VERSION *= *"[^"]+"' core/api.py | head -1 | cut -d'"' -f2)
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "自动构建：APP_VERSION=$APP_VER，tag 将为 v${APP_VER}-b${{ github.run_number }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag=v$TAG  APP_VERSION=$APP_VER"
            [ "$TAG" = "$APP_VER" ] \
              || { echo "[错误] tag v$TAG 与 APP_VERSION $APP_VER 不一致：改 APP_VERSION 后重新打 tag"; exit 1; }
          fi

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt "cython>=3.0" "pyinstaller>=6.0" setuptools wheel

      - name: Cython build（core/*.py -> *.pyd，源码不入包）
        run: python setup_pyd.py build_ext --inplace

      - name: PyInstaller pack + zip（zip 名自带版本号）
        run: python pyd_pack.py

      - name: Smoke test（产物完整）
        shell: bash
        run: |
          APP_VER=$(grep -oE 'APP_VERSION *= *"[^"]+"' core/api.py | head -1 | cut -d'"' -f2)
          test -f "dist/device_bebugging_tool_v${APP_VER}_win64.zip" \
            || { echo "[错误] 分发 zip 未生成"; exit 1; }
          test -f "dist/adb_tool/adb_tool.exe" \
            || { echo "[错误] adb_tool.exe 未生成"; exit 1; }
          N=$(find dist/adb_tool -path "*core*.pyd" | wc -l)
          echo "core pyd 数量: $N"
          [ "$N" -ge 10 ] || { echo "[错误] core pyd 少于 10 个"; exit 1; }

      - name: Rename with build number
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          cd dist
          for f in device_bebugging_tool_v*_win64.zip; do
            [ -f "$f" ] || continue
            mv "$f" "${f%.zip}-b${{ github.run_number }}.zip"
            echo "renamed -> ${f%.zip}-b${{ github.run_number }}.zip"
          done
          ls -1

      - name: List dist
        shell: bash
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-win64
          path: dist/device_bebugging_tool_*.zip
          if-no-files-found: error
          retention-days: 14

  # 统一在最后一步建 Release + 挂 assets：避免 mac/win 两个 job 并发创建 Release 冲突
  publish:
    needs: [macos, windows]
    # 任一平台失败/取消也要把"已经构建成功的那部分"发出去。
    # 否则一个腿挂掉（如 runner 排队被取消）就连 tag/Release 都看不到，
    # 完全不知道是没触发还是构建失败。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_REF }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: Check downloaded assets
        run: |
          echo "下载到的产物："
          ls -1 dist || true
          N=$(ls -1 dist/*.zip 2>/dev/null | wc -l)
          [ "$N" -gt 0 ] || { echo "[错误] 没有任何 zip 产物（所有平台都失败了），不建 Release"; exit 1; }
          [ "$N" -ge 3 ] || echo "::warning::只拿到 $N 个产物（正常是 3 个），本次 Release 不完整"

      - name: Compute tag / version
        id: meta
        run: |
          APP_VER=$(grep -oE 'APP_VERSION *= *"[^"]+"' core/api.py | head -1 | cut -d'"' -f2)
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="v${APP_VER}-b${{ github.run_number }}"
            PRE=true
            TITLE="device_bebugging_tool v${APP_VER} 自动构建 #${{ github.run_number }}"
          else
            TAG="${GITHUB_REF_NAME}"
            PRE=false
            TITLE="device_bebugging_tool ${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          {
            echo "## 产物"
            echo ""
            echo "| 平台 | 文件 |"
            echo "|---|---|"
            for f in dist/*.zip; do
              echo "| $(basename "$f" | grep -q win64 && echo Windows || echo macOS) | \`$(basename "$f")\` |"
            done
            echo ""
            echo "构建提交：\`$(git rev-parse --short HEAD)\` $(git log -1 --format=%s)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$TAG prerelease=$PRE"

      - name: List assets
        run: ls -lh dist

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.zip
