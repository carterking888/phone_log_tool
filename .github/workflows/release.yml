name: Release

# 版本号自动递增，不需要手改 core/api.py（规则与实现见仓库根目录 ci_version.sh）：
#
#   每次 push 到 main -> 取最新 v* tag 的 patch +1   （v2.7.0 -> v2.7.1 -> v2.7.2 ...）
#   应用内显示的版本 / 产物 zip 文件名 / GitHub tag / Release 标题 —— 全部用这一个版本。
#   先由 version job 算一次，再把结果传给 mac / win / publish，保证同一次运行内一致。
#
# 两种触发方式，产物都会自动挂到 GitHub Release（assets）：
#
#   A) 自动：push 到 main 后立刻出包并发「预发布」Release
#      - tag    : v2.7.1
#      - 产物   : device_bebugging_tool_v2.7.1_macos_arm64.zip
#                 device_bebugging_tool_v2.7.1_macos_x86_64.zip
#                 device_bebugging_tool_v2.7.1_win64.zip
#
#   B) 正式：手动打 tag（不递增，直接用 tag 本身）
#      git tag v2.8.0 && git push origin v2.8.0
#      - 之后自动递增会从 2.8.0 继续（下一个 push -> 2.8.1），不会版本回退
#      - 产物：device_bebugging_tool_v2.8.0_{win64,macos_arm64,macos_x86_64}.zip
#
# 构建源：push 触发打的就是本次提交；tag 触发固定取 main（env.BUILD_REF）。

on:
  push:
    branches: [main]
    tags: ['v*']
    # 只改文档不发版，省 runner 时长
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: write

# 串行化：版本号是「读最新 tag +1」算出来的，若两次 push 的构建并发跑完，
# 第二次会算出与第一次相同的版本 → 直接把上一个 Release 的 assets 覆盖掉。
# 这里让新 push 取消还没跑完的旧运行：旧运行不会建 tag，所以版本号不会断号，
# 也不会出现「同一个版本发两次」或两个 run 抢同一个 tag。
# 想改成「排队等旧的跑完、每次 push 都出一个版本」，把 cancel-in-progress 改成 false。
# group 带 ref：正式发版（tag 触发）与分支 push 不在同一队列，打 tag 不会被打断。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_REF: main   # tag 触发时的构建源分支（push 触发用 github.sha）
  # CI 的 Windows runner stdout 默认 cp1252：adb_tool.spec / pyd_pack.py 里的
  # 中文 print 会 UnicodeEncodeError，强制 utf-8（对 mac/linux 无影响）
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  # 版本号只在这里算一次，其余 job 复用它。若让 mac/win/publish 各自去读 tag，
  # 期间一旦有新 tag 产生，几个 job 就会算出不同版本，产物名和 tag 会对不上。
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_REF }}
          fetch-depth: 0          # ci_version.sh 需要完整 tag 列表
      - name: Resolve version（最新 tag 的 patch +1）
        id: v
        run: |
          VER=$(bash ci_version.sh)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：v$VER"
          echo "### 本次版本 v$VER" >> "$GITHUB_STEP_SUMMARY"

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14+ 是 Apple Silicon(arm64)；Intel(x86_64) 必须用 macos-15-intel
          # ★ macos-13 已被 GitHub 于 2025-12-04 下线：label 没有匹配的 runner 时
          #   不会报错，而是**排队到 24h 上限再自动取消**（表现为永远"等待中"，
          #   publish 被一直卡住、tag/Release 都出不来）。
          #   macos-15-intel 是官方现存的 x86_64 镜像，支持到约 2027-08。
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90   # 兜底：万一 label 失效也不会挂满 24h
    steps:
      - uses: actions/checkout@v4
        with:
          # push -> 打刚合进来的提交；tag -> 取 main
          ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_REF }}
          fetch-depth: 0

      - name: Show build source
        run: |
          echo "event    : ${{ github.event_name }}"
          echo "ref      : ${{ github.ref_name }}"
          echo "commit   : $(git rev-parse --short HEAD)"
          echo "subject  : $(git log -1 --format=%s)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 把 version job 算好的版本号写进 core/api.py：
      # 应用内显示（appVersion）与产物 zip 名（build_mac.sh 读它）都从这里取
      - name: Set version
        run: bash ci_version.sh "${{ needs.version.outputs.ver }}"

      - name: Build .app（WITH_IOS=1，内置 adb，zip 名自带版本号）
        run: |
          chmod +x build_mac.sh
          WITH_IOS=1 ./build_mac.sh

      - name: Smoke test（可执行文件存在且进程能活过初始化）
        run: |
          NAME="device_bebugging_tool"
          APP_VER=$(grep -oE 'APP_VERSION *= *"[^"]+"' core/api.py | head -1 | cut -d'"' -f2)
          EXE="dist/$NAME.app/Contents/MacOS/$NAME"
          test -x "$EXE" || { echo "[错误] 找不到 $EXE"; exit 1; }
          test -f "dist/${NAME}_v${APP_VER}_macos_${{ matrix.arch }}.zip" \
            || { echo "[错误] 分发 zip 未生成"; exit 1; }
          "$EXE" & PID=$!
          sleep 15
          kill -0 "$PID" 2>/dev/null && { echo "进程存活 15s -> OK"; kill "$PID" || true; } \
            || { echo "[错误] 进程 15s 内退出"; exit 1; }

      # 产物名自带版本号（device_bebugging_tool_v2.7.1_macos_arm64.zip），版本每次
      # 递增已保证唯一，以前给文件名加 -b<run 号> 的改名步骤不再需要。
      # path 仍用宽松通配 dist/device_bebugging_tool_*.zip（每个 job 的 dist 只含自己的产物）
      - name: List dist
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos-${{ matrix.arch }}
          path: dist/device_bebugging_tool_*.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WITH_IOS: '1'   # adb_tool.spec 读取：打进 pymobiledevice3（iOS 支持）
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_REF }}
          fetch-depth: 0

      - name: Show build source
        shell: bash
        run: |
          echo "event    : ${{ github.event_name }}"
          echo "ref      : ${{ github.ref_name }}"
          echo "commit   : $(git rev-parse --short HEAD)"
          echo "subject  : $(git log -1 --format=%s)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 同 macos job：写入 version job 算出的版本号（Cython 编译前后必须是同一个值）
      - name: Set version
        shell: bash
        run: bash ci_version.sh "${{ needs.version.outputs.ver }}"

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt "cython>=3.0" "pyinstaller>=6.0" setuptools wheel

      - name: Cython build（core/*.py -> *.pyd，源码不入包）
        run: python setup_pyd.py build_ext --inplace

      - name: PyInstaller pack + zip（zip 名自带版本号）
        run: python pyd_pack.py

      - name: Smoke test（产物完整）
        shell: bash
        run: |
          APP_VER=$(grep -oE 'APP_VERSION *= *"[^"]+"' core/api.py | head -1 | cut -d'"' -f2)
          test -f "dist/device_bebugging_tool_v${APP_VER}_win64.zip" \
            || { echo "[错误] 分发 zip 未生成"; exit 1; }
          test -f "dist/adb_tool/adb_tool.exe" \
            || { echo "[错误] adb_tool.exe 未生成"; exit 1; }
          N=$(find dist/adb_tool -path "*core*.pyd" | wc -l)
          echo "core pyd 数量: $N"
          [ "$N" -ge 10 ] || { echo "[错误] core pyd 少于 10 个"; exit 1; }

      - name: List dist
        shell: bash
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-win64
          path: dist/device_bebugging_tool_*.zip
          if-no-files-found: error
          retention-days: 14

  # 统一在最后一步建 Release + 挂 assets：避免 mac/win 两个 job 并发创建 Release 冲突
  publish:
    needs: [version, macos, windows]
    # 任一平台失败/取消也要把"已经构建成功的那部分"发出去。
    # 否则一个腿挂掉（如 runner 排队被取消）就连 tag/Release 都看不到，
    # 完全不知道是没触发还是构建失败。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_REF }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: Check downloaded assets
        run: |
          echo "下载到的产物："
          ls -1 dist || true
          N=$(ls -1 dist/*.zip 2>/dev/null | wc -l)
          [ "$N" -gt 0 ] || { echo "[错误] 没有任何 zip 产物（所有平台都失败了），不建 Release"; exit 1; }
          [ "$N" -ge 3 ] || echo "::warning::只拿到 $N 个产物（正常是 3 个），本次 Release 不完整"

      - name: Compute tag / version
        id: meta
        run: |
          # 版本号由 version job 统一算出（最新 tag 的 patch +1；正式发版则等于 tag 本身）。
          # 每个版本只会出现一次，所以 tag 就是 v<版本号>，不再需要 -b<run 号> 后缀。
          VER="${{ needs.version.outputs.ver }}"
          [ -n "$VER" ] || VER=$(bash ci_version.sh)
          TITLE="device_bebugging_tool v${VER}"
          TAG="v${VER}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            PRE=false
          else
            PRE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          {
            echo "## 产物"
            echo ""
            echo "| 平台 | 文件 |"
            echo "|---|---|"
            for f in dist/*.zip; do
              echo "| $(basename "$f" | grep -q win64 && echo Windows || echo macOS) | \`$(basename "$f")\` |"
            done
            echo ""
            echo "构建提交：\`$(git rev-parse --short HEAD)\` $(git log -1 --format=%s)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$TAG prerelease=$PRE"

      - name: List assets
        run: ls -lh dist

      # body 会被 GitHub **前置**到自动生成的 "What's Changed" 之前，
      # 所以发布页 = 功能介绍 + 提交记录；assets 由 GitHub 自己列在页面下方。
      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: |
            ✨ 功能介绍

            桌面端 Android & iOS 设备调试工具，深色开发主题，包含四大模块：

            - 📱 设备管理：ADB(Android) / libimobiledevice(iOS) 设备列表、连接检测
            - 📄 日志查看：实时抓取 Android logcat、iOS syslog 设备日志
            - 📦 应用包管理：查看/安装/卸载应用，支持安卓 APK、iOS ipa 基础操作
            - 📂 文件管理：设备文件上传、下载、浏览
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.zip
